version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: graphix_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: graphix_user
      POSTGRES_PASSWORD: graphix_pass
      POSTGRES_DB: graphix_db
    ports:
      - "5432:5432" 
    volumes:
      - graphix_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphix_user -d graphix_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: graphix_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@graphix.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  graphix_pgdata:
